name: Bootstrap TarlaPusula v26 from v25

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-v25.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v26
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone v25 baseline
        run: git clone --depth 1 https://github.com/oguzhanozeren92-debug/tarlapusulav25.git /tmp/tarlapusulav25

      - name: Replace v26 working tree with v25 baseline except workflows
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/v26-workflows
          mkdir -p /tmp/v26-workflows
          if [ -d .github/workflows ]; then
            cp -a .github/workflows/. /tmp/v26-workflows/
          fi

          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          (cd /tmp/tarlapusulav25 && tar --exclude='.git' --exclude='./.github/workflows' -cf - .) | tar -xf -

          mkdir -p .github/workflows
          cp -a /tmp/v26-workflows/. .github/workflows/

      - name: Commit v25 baseline into v26
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No baseline changes to commit.'
            exit 0
          fi
          git commit -m 'chore: bootstrap v26 from TarlaPusula v25 baseline'
          git push origin HEAD:main
