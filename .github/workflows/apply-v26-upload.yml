name: Apply TarlaPusula v26 Upload

on:
  push:
    branches: [main]
    paths:
      - '.sync/READY'

permissions:
  contents: write

jobs:
  apply-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild uploaded patch
        shell: bash
        run: |
          set -euo pipefail
          test -f .sync/READY
          test -f .sync/v26_patch_part_01.txt
          cat .sync/v26_patch_part_*.txt > /tmp/v26_patch.b64
          base64 --decode /tmp/v26_patch.b64 > /tmp/v26_delta.patch.xz
          xz --decompress --stdout /tmp/v26_delta.patch.xz > /tmp/v26_delta.patch

      - name: Apply uploaded project changes
        shell: bash
        run: |
          set -euo pipefail
          git apply --3way --whitespace=nowarn /tmp/v26_delta.patch || {
            echo "3-way apply failed; retrying with reject mode"
            git reset --hard HEAD
            git apply --reject --whitespace=nowarn /tmp/v26_delta.patch
          }
          rm -rf .sync

      - name: Verify app build
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Commit uploaded project changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':!.github/workflows'
          if git diff --cached --quiet; then
            echo 'No project changes to commit.'
            exit 0
          fi
          git commit -m 'sync: apply latest TarlaPusula uploaded ZIP changes'
          git push origin HEAD:main
